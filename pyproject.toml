[project]
name = "forecast-spine"
version = "0.1.0"
description = "Point-in-time correct ERCOT load forecast evaluation pipeline"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "pyarrow>=17.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
notebook = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "jupyter>=1.1",
    "nbconvert>=7.16",
]

[project.scripts]
forecast-spine = "forecast_spine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "E731",   # small lambdas read better than defs inside a single test
    "B008",   # typer.Option in a default is how Typer declares CLI options
]
